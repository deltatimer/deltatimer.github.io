<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="assets/icon.png">
<title>DELTARUNE PROPHECY</title>

<style>
@font-face{
font-family:'Und';
src:url('assets/und.ttf');
}

*{
-webkit-tap-highlight-color:transparent;
box-sizing:border-box;
}

html,body{
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
font-family: 'Und';
}

body{
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
position: relative;
min-height: 100vh;
}

/* Основной контент — без z-index, чтобы цветы были поверх при необходимости,
   но цветы полупрозрачные, так что текст будет виден сквозь них */
.content-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 0 16px;
  box-sizing: border-box;
  pointer-events: auto;
}

/* Логотип — без z-index, естественный поток */
.logo-video {
  display: block;
  margin: 0 auto 20px auto;
  width: auto;
  height: auto;
  max-width: 450px;
  max-height: 210px;
  pointer-events: none;
  object-fit: contain;
}

/* ЦВЕТЫ — исправлено: убраны артефакты, правая сторона без пустой линии */
.flowers-left {
  position: fixed;
  top: 0;
  left: 0;
  width: auto;
  height: 100%;
  pointer-events: none;
  z-index: 10;
  opacity: 0.55;
  object-fit: cover;
  object-position: left center;
}

.flowers-right {
  position: fixed;
  top: 0;
  right: 0;
  width: auto;
  height: 100%;
  pointer-events: none;
  z-index: 10;
  opacity: 0.55;
  object-fit: cover;
  object-position: right center;
  /* Убираем scaleX(-1) — он создавал артефакты и пустую линию,
     вместо этого просто показываем зеркальное отражение через transform 
     но без сдвигов и пустот */
  transform: scaleX(-1);
}

/* Альтернативный вариант, если transform scale даёт артефакты - используем чистый флип без смещений */
.flowers-right {
  transform: scaleX(-1);
  transform-origin: center;
}
  
.timer,.text,.label{
background: url('assets/textures/depth-text.png') repeat;
background-size: 256px 256px;
-webkit-background-clip: text;
background-clip: text;
color: transparent;
animation: bgMove 7s ease-in-out infinite alternate;
user-select: none;
text-align: center;
position: relative;
}

.label{
font-size: 22px;
margin-bottom: -5px;
letter-spacing: 1px;
}

.timer{
font-size: 48px;
margin-bottom: 8px;
letter-spacing: 2px;
font-weight: bold;
}

.text{
font-size: 26px;
letter-spacing: 1px;
}

@keyframes bgMove{
0%{background-position: 0 0}
100%{background-position: 120px 120px}
}

#gate{
position: fixed;
inset: 0;
background: #000;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
gap: 24px;
z-index: 9999;
color: #fff;
text-align: center;
padding: 20px;
}

#gate button{
font-family: 'Und', Arial, sans-serif;
font-size: 20px;
padding: 12px 28px;
border: none;
border-radius: 8px;
background: #1a73e8;
color: #fff;
cursor: pointer;
transition: opacity 0.2s, transform 0.1s;
}

#gate button:active {
  transform: scale(0.96);
}

.lang{
position: fixed;
top: 12px;
left: 12px;
display: flex;
gap: 12px;
z-index: 999;
}

.lang button{
font-family: 'Und';
font-size: 16px;
padding: 6px 14px;
background: #000;
border: 1px solid #fff;
color: #fff;
cursor: pointer;
transition: all 0.2s;
border-radius: 4px;
}

.lang button:active {
  background: #333;
}

/* ===== ТЕЛЕФОНЫ: ЦВЕТЫ МЕНЬШЕ, НЕТ ПУСТЫХ ЛИНИЙ ===== */
@media (max-width: 760px) {
  .logo-video {
    max-width: 320px;
    max-height: 150px;
    margin-top: 8px;
    margin-bottom: 20px;
  }
  
  .label { 
    font-size: 20px; 
    margin-bottom: -3px;
  }
  
  .timer { 
    font-size: 42px; 
    margin-bottom: 8px;
  }
  
  .text { 
    font-size: 22px; 
  }
  
  /* ЦВЕТЫ — меньше, без пустот и артефактов */
  .flowers-left {
    width: 35%;
    height: 100%;
    opacity: 0.4;
    object-fit: cover;
    object-position: left center;
  }
  
  .flowers-right {
    width: 35%;
    height: 100%;
    opacity: 0.4;
    object-fit: cover;
    object-position: right center;
    transform: scaleX(-1);
  }
  
  .content-wrapper {
    padding: 0 20px;
    max-width: 90%;
  }
  
  .timer, .text, .label {
    max-width: 90vw;
    word-break: break-word;
  }
  
  .lang button {
    font-size: 15px;
    padding: 5px 12px;
  }
  
  #gate button {
    font-size: 18px;
    padding: 10px 24px;
  }
  
  #gateText {
    font-size: 20px;
    max-width: 80%;
    line-height: 1.4;
  }
}

@media (max-width: 480px) {
  .logo-video {
    max-width: 260px;
    max-height: 120px;
    margin-bottom: 16px;
  }
  
  .label { 
    font-size: 18px; 
  }
  
  .timer { 
    font-size: 36px; 
  }
  
  .text { 
    font-size: 20px; 
  }
  
  /* ЕЩЁ МЕНЬШЕ ЦВЕТЫ НА МАЛЕНЬКИХ ТЕЛЕФОНАХ */
  .flowers-left {
    width: 28%;
    opacity: 0.35;
  }
  
  .flowers-right {
    width: 28%;
    opacity: 0.35;
  }
  
  .lang button { 
    font-size: 14px;
    padding: 5px 10px;
  }
  
  .content-wrapper {
    padding: 0 12px;
  }
  
  #gate button {
    font-size: 17px;
    padding: 9px 22px;
  }
  
  #gateText {
    font-size: 18px;
  }
}

@media (max-width: 400px) {
  .label { 
    font-size: 17px; 
  }
  
  .timer { 
    font-size: 32px; 
  }
  
  .text { 
    font-size: 18px; 
  }
  
  .flowers-left {
    width: 24%;
    opacity: 0.3;
  }
  
  .flowers-right {
    width: 24%;
    opacity: 0.3;
  }
  
  .lang button {
    font-size: 13px;
    padding: 4px 9px;
  }
}

@media (max-width: 360px) {
  .label { 
    font-size: 15px; 
  }
  
  .timer { 
    font-size: 28px; 
  }
  
  .text { 
    font-size: 16px; 
  }
  
  .logo-video {
    max-width: 220px;
    max-height: 100px;
  }
  
  .flowers-left {
    width: 20%;
    opacity: 0.25;
  }
  
  .flowers-right {
    width: 20%;
    opacity: 0.25;
  }
  
  #gate button {
    font-size: 16px;
    padding: 8px 20px;
  }
}

/* Альбомная ориентация на телефонах */
@media (max-width: 800px) and (orientation: landscape) {
  .flowers-left,
  .flowers-right {
    width: 20%;
    opacity: 0.3;
  }
  
  .logo-video {
    max-width: 240px;
    max-height: 100px;
    margin-bottom: 10px;
  }
  
  .timer {
    font-size: 32px;
  }
  
  .text {
    font-size: 18px;
  }
  
  .label {
    font-size: 16px;
  }
  
  .content-wrapper {
    padding: 0 20px;
  }
}

/* Дополнительный фикс для очень широких экранов — чтобы цветы не создавали пустую полосу справа */
@media (min-width: 1920px) {
  .flowers-left,
  .flowers-right {
    width: auto;
    max-width: 35%;
  }
}

/* Чтобы изображения цветов не обрезались резко — плавный край */
.flowers-left, .flowers-right {
  -webkit-mask-image: linear-gradient(to right, black, black 85%, transparent);
  mask-image: linear-gradient(to right, black, black 85%, transparent);
}

.flowers-right {
  -webkit-mask-image: linear-gradient(to left, black, black 85%, transparent);
  mask-image: linear-gradient(to left, black, black 85%, transparent);
}
</style>
</head>
<body>

<img class="flowers-left" src="assets/textures/ch5-flowers.png" alt="flowers">
<img class="flowers-right" src="assets/textures/ch5-flowers.png" alt="flowers">

<div class="content-wrapper">
  <video class="logo-video" autoplay loop muted playsinline disablePictureInPicture>
    <source src="assets/logo-ch5.mp4" type="video/mp4">
  </video>

  <div class="label" id="timerLabel">До оф. релиза:</div>
  <div class="timer" id="timer">00:00:00:00</div>
  <div class="text" id="online">Loading...</div>
</div>

<div id="gate">
  <div id="gateText">Чтобы продолжить.. вы должны принять пророчество.</div>
  <button onclick="start()">Go</button>
</div>

<div class="lang">
  <button onclick="setLang('ru')">RU</button>
  <button onclick="setLang('en')">EN</button>
</div>

<audio id="a1" src="assets/darksanct.mp3" loop></audio>
<audio id="a2" src="assets/thesecondsanct.mp3" loop></audio>
<audio id="a3" src="assets/thethirdsanct.mp3" loop></audio>
<audio id="a4" src="assets/everhigher.mp3" loop></audio>
<audio id="a5" src="assets/neverendingnight.mp3" loop></audio>
<audio id="a6" src="assets/12am.mp3" loop></audio>
<audio id="a7" src="assets/13am.mp3" loop></audio>

<script>
const WORKER="https://deltarune.ipvds.workers.dev";

const timer=document.getElementById("timer");
const online=document.getElementById("online");
const timerLabel=document.getElementById("timerLabel");
const gateText=document.getElementById("gateText");

const tracks=[a1,a2,a3,a4,a5,a6,a7];

let lang=navigator.language.startsWith("ru")?"ru":"en";
let userId=localStorage.getItem("uid");

function stopAll(){
tracks.forEach(t=>{t.pause();t.currentTime=0;});
}

function play(i){
stopAll();
tracks[i].play().catch(()=>{});
}

function music(){
let h=new Date().getHours();

if(h>=6&&h<10)play(0);
else if(h>=10&&h<16)play(1);
else if(h>=16&&h<20)play(2);
else if(h>=20&&h<23)play(3);
else if(h>=23||h<0)play(4);
else if(h>=0&&h<1)play(5);
else if(h>=1&&h<6)play(6);
}

function updateTimer(){
let d=new Date();
let target=new Date(2026, 5, 24, 0, 0, 0);
let diff=target-d;

if(diff<=0){
timer.innerText="00:00:00:00";
return;
}

let D=Math.floor(diff/86400000);
let H=Math.floor(diff/3600000)%24;
let M=Math.floor(diff/60000)%60;
let S=Math.floor(diff/1000)%60;

timer.innerText=`${D.toString().padStart(2,"0")}:${H.toString().padStart(2,"0")}:${M.toString().padStart(2,"0")}:${S.toString().padStart(2,"0")}`;
}

function setLang(l){
lang=l;
timerLabel.innerText = l === "ru" ? "До оф. релиза:" : "Until official release:";
online.innerText = l === "ru" ? "Онлайн сайта: ..." : "Site online: ...";
gateText.innerText = l === "ru" ? "Чтобы продолжить.. вы должны принять пророчество." : "To proceed.. you must accept the prophecy.";
}

async function ping(){
try{
let r=await fetch(WORKER+"/ping?id="+(userId||""));
let j=await r.json();

userId=j.id;
localStorage.setItem("uid",userId);

online.innerText=(lang==="ru"?"Онлайн сайта: ":"Site online: ")+j.online;

}catch(e){}
}

function leave(){
if(!userId) return;
navigator.sendBeacon(WORKER+"/leave?id="+userId);
}

function start(){
gate.style.display="none";
music();
setInterval(music,60000);
setInterval(ping,5000);
ping();
}

window.addEventListener("beforeunload",leave);
window.addEventListener("pagehide",leave);

setLang(lang);
updateTimer();
setInterval(updateTimer,1000);
</script>

</body>
</html>
